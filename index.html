<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epoch MC | 真实地球 · 国战服务器</title>
    <meta name="description" content="Epoch MC - 以真实地球为棋盘，建国立政、扩张领土、纵横捭阖的 Minecraft 国战服务器">
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.font.im">
    <link rel="preconnect" href="https://fonts.font.im" crossorigin>
    <link href="https://fonts.font.im/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('epochmc-theme')
          var theme = stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'auto'
          var dark =
            theme === 'dark' ||
            (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
