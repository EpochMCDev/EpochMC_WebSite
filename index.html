<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpochMC | 真实地球 · 国战服务器</title>
    <meta name="description" content="EpochMC - 以真实地球为棋盘，建国立政、扩张领土、纵横捭阖的 Minecraft 国战服务器">
    <link rel="icon" href="/images/favicon.webp" type="image/webp">
    <link rel="preload" as="image" href="/images/hero/bg1.webp" fetchpriority="high">
    <link rel="preload" as="image" href="/images/logo.webp" fetchpriority="high">
    <meta name="robots" content="noindex, nofollow">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('epochmc-theme')
          var theme = stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'auto'
          var dark =
            theme === 'dark' ||
            (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
